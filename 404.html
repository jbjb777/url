<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>

<style>
body {
  font-family: sans-serif;
  background: #111;
  color: white;
  padding: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}

button {
  padding: 10px 16px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #222;
  border-radius: 10px;
  word-break: break-all;
}
</style>
</head>
<body>

<h1>URL Shortener</h1>

<input
  type="text"
  id="url"
  placeholder="https://example.com"
/>

<button onclick="createShortUrl()">
단축 URL 생성
</button>

<div class="result" id="result">
아직 생성되지 않음
</div>

<script>

const API =
  "https://d-log-api.alexeom97.workers.dev/api/posts";

async function createShortUrl() {

  const url =
    document.getElementById("url").value;

  if (!url) {
    alert("URL 입력");
    return;
  }

  const res = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    },
    body: JSON.stringify({
      url
    })
  });

  const data = await res.json();

  // Supabase return=representation 결과
  const item = data[0];

  const shortUrl =
    `https://url.jbjb.r-e.kr/${item.id}`;

  document.getElementById("result").innerHTML = `
    <p><b>원본 URL:</b></p>
    <p>${item.url}</p>

    <p style="margin-top:15px;">
      <b>단축 URL:</b>
    </p>

    <a
      href="${shortUrl}"
      target="_blank"
      style="color:skyblue;"
    >
      ${shortUrl}
    </a>
  `;
}

</script>

</body>
</html>
