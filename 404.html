<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>

<style>
body{
  background:#111;
  color:white;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
</style>
</head>
<body>

<div id="text">
링크 확인중...
</div>

<script>

const API =
  "https://d-log-api.alexeom97.workers.dev/api/posts";

// 현재 주소
// /ABCDE
const code =
  location.pathname.slice(1);

async function redirect() {

  // 메인페이지
  if (!code) {
    document.getElementById("text").innerHTML =
      "잘못된 링크";
    return;
  }

  try {

    // 전체 게시글 가져오기
    const res = await fetch(API);

    const data = await res.json();

    // id 찾기
    const item =
      data.find(v => v.id === code);

    // 없음
    if (!item) {
      document.getElementById("text").innerHTML =
        "404 링크 없음";
      return;
    }

    let target = item.url;

    // https 자동추가
    if (
      !target.startsWith("http://") &&
      !target.startsWith("https://")
    ) {
      target = "https://" + target;
    }

    // 이동
    location.href = target;

  } catch(err) {

    document.getElementById("text").innerHTML =
      "오류 발생";

    console.error(err);
  }
}

redirect();

</script>

</body>
</html>
